name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L # templates, skills, generation, MCP configuration

  template:
    needs: flake
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        providers: [aws, azure, gcp, oci, kubernetes, cloudflare, hetzner, digitalocean, "aws azure", "aws cloudflare"]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }} # informative until stable
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - name: generate project and run devenv test
        env:
          PROVIDERS: ${{ matrix.providers }}
        run: |
          d=$(mktemp -d)
          # shellcheck disable=SC2086
          nix run . -- $PROVIDERS --into "$d"
          cd "$d" && git init -q && git add -A
          devenv --override-input cloud "path:$GITHUB_WORKSPACE" test
      - name: Terraform MCP handshake (no cloud credentials)
        if: matrix.os == 'ubuntu-latest' && matrix.providers == 'aws'
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          nix run . -- aws --into "$scratch/project"
          cd "$scratch/project"
          git add -A
          nix shell nixpkgs#python3 --command devenv --override-input cloud "path:$GITHUB_WORKSPACE" shell -- python3 "$GITHUB_WORKSPACE/tests/mcp-smoke.py" .mcp.json

  secrets:
    needs: flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - name: secrets smoke test
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          d="$scratch/project with spaces"
          nix run . -- aws --into "$d"
          cd "$d"
          git add -A
          devenv --override-input cloud "path:$GITHUB_WORKSPACE" shell -- bash "$GITHUB_WORKSPACE/tests/secrets.sh"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#trivy -- fs --scanners secret --exit-code 1 .
